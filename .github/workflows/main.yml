name: Build SukiSU Ultra GKI Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: 'common-android12-5.10'
      susi_mode:
        description: 'SukiSU mode'
        required: true
        default: 'susfs-main'
        type: choice
        options:
          - susfs-main
          - main
      lto:
        description: 'LTO mode'
        required: true
        default: 'thin'
        type: choice
        options:
          - thin
          - full
          - none

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev \
            libelf-dev curl zip unzip python3 python3-pip repo wget cpio \
            ccache lzop bzip2 gperf
          git config --global user.email "builder@local"
          git config --global user.name "Builder"

      - name: Sync kernel source
        run: |
          mkdir -p kernel && cd kernel
          repo init --depth 1 -u https://android.googlesource.com/kernel/manifest -b ${{ github.event.inputs.kernel_branch }}
          repo sync -j$(nproc)

      - name: Integrate SukiSU Ultra
        run: |
          cd kernel/common
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.susi_mode }}

      - name: Create defconfig fragment
        run: |
          cat > kernel/custom.fragment << 'EOF'
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          cat kernel/custom.fragment

      - name: Build kernel
        run: |
          cd kernel
          GKI_DEFCONFIG_FRAGMENT=custom.fragment \
          LTO=${{ github.event.inputs.lto }} \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh

      - name: Package AnyKernel3
        run: |
          set -e
          WORKDIR=$(pwd)
          
          IMAGE_PATH=$(find "$WORKDIR/kernel/out" -name "Image.lz4" -type f 2>/dev/null | head -1)
          if [ -z "$IMAGE_PATH" ] || [ ! -f "$IMAGE_PATH" ]; then
            IMAGE_PATH=$(find "$WORKDIR/kernel/out" -name "Image" -type f 2>/dev/null | head -1)
          fi
          
          echo "Kernel image: $IMAGE_PATH"
          if [ -z "$IMAGE_PATH" ] || [ ! -f "$IMAGE_PATH" ]; then
            echo "ERROR: Kernel image not found!"
            find "$WORKDIR/kernel/out" -name "Image*" | head -20
            exit 1
          fi
          
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp "$IMAGE_PATH" ak3/Image
          
          cd ak3
          sed -i 's/is_slot_device=0/is_slot_device=1/' anykernel.sh
          sed -i 's/device.name1=placeholder/device.name1=diting/' anykernel.sh
          zip -r9 ../SukiSU-Ultra-GKI-android12-5.10.zip .
          cd ..
          ls -lh SukiSU-Ultra-GKI-android12-5.10.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-GKI-Kernel
          path: SukiSU-Ultra-GKI-android12-5.10.zip
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SukiSU Ultra GKI - Build ${{ github.run_number }}
          body: |
            **Build #${{ github.run_number }}**
            - Kernel: android12-5.10
            - SukiSU: ${{ github.event.inputs.susi_mode }}
            - LTO: ${{ github.event.inputs.lto }}
          files: SukiSU-Ultra-GKI-android12-5.10.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
